{% load i18n %}

<div class="detail">
  {% if secret_refs %}
    <table class="table table-striped table-bordered detail-table">
      <colgroup>
        <col style="width:25%">
        <col style="width:75%">
      </colgroup>
      <thead>
        <tr>
          <th>{% trans "Role / Label" %}</th>
          <th>{% trans "Secret Ref" %}</th>
        </tr>
      </thead>
      <tbody>
        {% for item in secret_refs %}
          <tr>
            <td><code>{{ item.name }}</code></td>
            <td>
              <code class="text-muted" style="word-break:break-all;">
                {{ item.ref }}
              </code>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p class="text-muted">
      <i class="fa fa-info-circle"></i>
      {% trans "No secrets are associated with this container." %}
    </p>
  {% endif %}
</div>
