{% load i18n %}

<div class="detail">
  {% if metadata %}
    <table class="table table-striped table-bordered detail-table">
      <colgroup>
        <col style="width:30%">
        <col style="width:70%">
      </colgroup>
      <thead>
        <tr>
          <th>{% trans "Key" %}</th>
          <th>{% trans "Value" %}</th>
        </tr>
      </thead>
      <tbody>
        {% for k, v in metadata.items %}
          <tr>
            <td><code>{{ k }}</code></td>
            <td>{{ v }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p class="text-muted">
      <i class="fa fa-info-circle"></i>
      {% trans "No metadata has been set on this secret." %}
    </p>
  {% endif %}
</div>
